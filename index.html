<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Pertanian Indonesia</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #f4f6f8;
        }

        header {
            background-color: #2e7d32;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 80px);
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: -70px;
            left: 0;
            width: 100%;
            height: calc(100% + 60px);
            border: none;
        }

    </style>
</head>

<body>

    <header>
        Dashboard Pertanian Indonesia
    </header>

    <div class="iframe-container">

        <iframe
            title="Project Database Pertanian"
            src="https://app.fabric.microsoft.com/view?r=eyJrIjoiOWZiYWUyMjMtNTE1MS00NGVjLWE0NzUtYTVkOTY0NzFkYjE0IiwidCI6ImJkNGJkY2ExLTIyNzctNDE3ZS05MGI0LTZkOTZkMDQxMWUyOCJ9&chromeless=true"
            allowfullscreen>
        </iframe>

    </div>

</body>

</html>
