<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard Pertanian Indonesia</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        header {
            background-color: #2e7d32;
            color: white;
            text-align: center;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 28px;
        }

        .dashboard-container {
            width: 100%;
            height: calc(100vh - 80px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Dashboard Pertanian Indonesia</h1>
    </header>

    <div class="dashboard-container">
        <iframe
            title="Project Database Pertanian"
            src="https://app.fabric.microsoft.com/view?r=eyJrIjoiOWZiYWUyMjMtNTE1MS00NGVjLWE0NzUtYTVkOTY0NzFkYjE0IiwidCI6ImJkNGJkY2ExLTIyNzctNDE3ZS05MGI0LTZkOTZkMDQxMWUyOCJ9&chromeless=true"
            allowfullscreen>
        </iframe>
    </div>

</body>

</html>
